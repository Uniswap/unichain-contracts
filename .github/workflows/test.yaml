name: test

on:
  pull_request:
    branches: [main, master, staging, dev, feat/**, fix/**]
  push:
    branches: [main, master, staging, dev]

env:
  FOUNDRY_PROFILE: ${{ github.event_name == 'push' && 'ci' || 'pr' }}

jobs:
  forge-test:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # gelatodigital/automate (nested in lib/optimism) was deleted upstream and is not imported here
      - name: Init nested submodules
        run: git -C lib/optimism -c submodule.packages/contracts-bedrock/lib/automate.update=none submodule update --init --recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run Forge build
        run: |
          echo Foundry profile: $FOUNDRY_PROFILE
          forge --version
          forge build --sizes
        id: build

      - name: Run Forge tests
        run: forge test -vvv
        id: test
        env:
          FORGE_SNAPSHOT_CHECK: true
